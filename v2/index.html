<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ویزیت آنلاین – دیجی‌کالا سلامت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET ───────────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{border:none;background:none;cursor:pointer;font:inherit}

/* ── ROOT ────────────────────────────────────────────────── */
:root{
  --green:#24a565;--green-lt:#c0e5d5;--green-dk:#1a7a4a;
  --teal:#0098b0;--teal-lt:#e5f3f5;--teal-dk:#008299;
  --page-bg:#fff;
  --text-dark:#0a0a0a;--text-mid:#2e3638;--text-muted:#798486;
  --card-bg:#f7f7f7;
  --radius-xl:24px;
  --font:'Vazirmatn',system-ui,sans-serif;
}

html,body{
  width:100%;height:100%;
  font-family:var(--font);
  background:#ededf0;
  overflow:hidden;
}

/* ── PHONE SHELL ─────────────────────────────────────────── */
#shell{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
}

#phone{
  position:relative;
  width:360px;height:100%;max-height:780px;
  background:var(--page-bg);
  border-radius:32px;
  overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;
}


/* ── APP BAR ─────────────────────────────────────────────── */
.app-bar{
  flex-shrink:0;
  height:56px;background:#fff;
  display:flex;flex-direction:row;align-items:center;
  padding:0 20px;gap:20px;
}
.app-bar-back{
  flex-shrink:0;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
}
.app-bar-back img{width:24px;height:24px;object-fit:contain}
.app-bar-title{
  flex:1;font-size:16px;font-weight:700;color:var(--text-dark);
  text-align:right;line-height:1.4;
}
.app-bar-spacer{flex-shrink:0;width:24px}

/* ── SCROLLABLE CONTENT ───────────────────────────────────── */
#scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#scroll::-webkit-scrollbar{display:none}

/* ── HERO ─────────────────────────────────────────────────── */
.hero{
  position:relative;
  height:455px;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:-40px; /* extend so blur edges are clipped */
  background:linear-gradient(175deg,#e8f4ee 0%,#d4ecff 40%,#f0e8ff 80%,#ffe8f0 100%);
  filter:blur(37px);
  opacity:.5;
}
.hero-bg img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
}
.hero-overlay{
  position:absolute;inset:0;
  background:#70b5ff;
  mix-blend-mode:overlay;
}
.hero-gradient{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0) 52%,
    rgba(255,255,255,.6) 78%,
    rgba(255,255,255,.97) 100%
  );
}

/* search inside hero */
.search-wrap{
  position:absolute;top:8px;left:16px;right:16px;
  z-index:10;
}
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);
  border-radius:12px;
  padding:10px 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.search-bar svg{width:18px;height:18px;color:var(--text-muted);flex-shrink:0}
.search-placeholder{
  font-size:13px;color:var(--text-muted);flex:1;text-align:right;
}

/* ── FLOAT FIELD ──────────────────────────────────────────── */
#float-field{
  position:absolute;
  top:80px;left:-1px;
  width:361px;height:288px;
  pointer-events:none; /* let child clicks bubble up */
}

/* ORBIT: carries position */
.orbit{
  position:absolute;
  will-change:left,top;
  pointer-events:all;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.orbit.move{
  transition:left .65s cubic-bezier(.34,1.56,.64,1),
             top  .65s cubic-bezier(.34,1.56,.64,1);
}

/* SIZER: carries size */
.sizer{
  position:relative; /* so progress ring can be positioned inside */
  transform:translate(-50%,-50%);
  will-change:width,height;
}
.sizer.move{
  transition:width .6s cubic-bezier(.34,1.56,.64,1),
             height .6s cubic-bezier(.34,1.56,.64,1);
}

/* FLOATER: carries float animation */
.floater{
  width:100%;height:100%;
}

/* GLASS BUBBLE ─────────────────────────────────────────── */
.glass{
  position:relative;
  width:100%;height:100%;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.88);
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  container-type:size; /* enable cq units inside */
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  /* inset glow added via var */
  box-shadow:
    0 var(--shadow-y,4px) var(--shadow-b,16px) var(--shadow-color,rgba(0,0,0,.08)),
    inset 0 0 var(--glow-sz,14px) 0 var(--glow,#0da598);
}
.glass-bg{
  position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(143.175deg,rgb(228,228,228) 17.02%,rgb(177,177,177) 113.38%);
}
.glass-color{
  position:absolute;inset:0;border-radius:inherit;
  background:var(--overlay,rgba(239,108,119,.8));
  mix-blend-mode:overlay;
}
.glass-shine{
  position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse at 36% 28%,rgba(255,255,255,.52) 0%,transparent 58%);
  pointer-events:none;
}
.spec-icon{
  position:relative;z-index:2;
  width:30cqmin;height:auto;
  object-fit:contain;
  flex-shrink:0;
}
.spec-count{
  position:relative;z-index:2;
  font-size:8.4cqw;
  font-weight:400;
  color:#111;
  white-space:nowrap;
  line-height:1.6;
  text-align:center;
  margin-top:1cqw;
}
.spec-name{
  position:relative;z-index:2;
  font-size:9.2cqw;
  font-weight:700;
  color:#111;
  white-space:nowrap;
  line-height:1.3;
  text-align:center;
}

/* center bubble: larger border */
.orbit.is-center .glass{
  border-width:3px;
}
.orbit.is-center .sizer{
  z-index:20;
}

/* ── FLOAT ANIMATIONS ─────────────────────────────────────── */
@keyframes float-a{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(-3px,-7px) rotate(-.8deg)}
  66%{transform:translate(4px,-4px) rotate(.5deg)}
}
@keyframes float-b{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  40%{transform:translate(5px,-8px) rotate(1deg)}
  80%{transform:translate(-2px,-5px) rotate(-.4deg)}
}
@keyframes float-c{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(0,-7px) rotate(.6deg)}
}
@keyframes float-d{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(4px,-6px) rotate(-.7deg)}
  75%{transform:translate(-5px,-4px) rotate(.9deg)}
}
@keyframes float-e{
  0%,100%{transform:translate(0,0)}
  30%{transform:translate(-4px,-5px) rotate(.5deg)}
  70%{transform:translate(3px,-9px) rotate(-.6deg)}
}
@keyframes float-f{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(-6px,-6px) rotate(.8deg)}
}
@keyframes float-g{
  0%,100%{transform:translate(0,0)}
  40%{transform:translate(3px,-10px) rotate(-.5deg)}
  80%{transform:translate(-2px,-3px)}
}
@keyframes float-h{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(6px,-5px) rotate(1deg)}
}

/* ── HERO TEXT ───────────────────────────────────────────── */
.hero-text{
  position:absolute;
  bottom:10px;left:48px;right:48px;
  text-align:center;
  z-index:10;
}
.hero-sub{
  font-size:13px;font-weight:500;
  color:var(--text-mid);
  margin-bottom:4px;
}
.hero-title{
  font-size:28px;font-weight:800;
  color:var(--text-dark);
  line-height:1.2;
}

/* ── SERVICES ─────────────────────────────────────────────── */
.services{
  display:flex;justify-content:space-around;
  padding:8px 24px 8px;
  background:#fff;
  gap:8px;
}
.service-item{
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
  flex:1;
}
.service-icon-wrap{
  width:75px;height:75px;
  background:var(--card-bg);
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.service-icon-wrap img{width:52px;height:52px;object-fit:contain}
.service-label{
  font-size:11px;font-weight:600;color:var(--text-mid);
  text-align:center;line-height:1.45;
  max-width:80px;
}

/* ── SECTION TITLE ────────────────────────────────────────── */
.section-hdr{
  display:flex;align-items:center;justify-content:flex-end;
  padding:20px 16px 12px;
  gap:8px;
  background:#fff;
}
.section-title{
  font-size:12px;font-weight:700;
  color:var(--text-mid);
  flex:1;text-align:right;
}
.section-icon{width:24px;height:24px;object-fit:contain}

/* ── CATEGORY LIST (vertical, swipeable) ──────────────────── */
.cat-section{background:#fff;padding-bottom:4px}
.cat-list{display:flex;flex-direction:column;padding:0 16px}

.cat-item-wrap{
  position:relative;
  height:94px;
  margin-bottom:16px;
  border-radius:16px;
  overflow:hidden;
  flex-shrink:0;
}

/* SWIPE REVEAL BACKGROUNDS */
.swipe-bg{
  position:absolute;inset:0;
  border-radius:16px;
  display:flex;align-items:center;
  direction:ltr; /* isolate from RTL so flex-start/end are physical */
}
.swipe-bg-left{
  background:var(--green);
  justify-content:flex-end;
  padding-right:36px;
}
.swipe-bg-right{
  background:#0098b0;
  justify-content:flex-start;
  padding-left:36px;
}
.swipe-bg-inner{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.swipe-bg-icon{width:30px;height:30px;object-fit:contain}
.swipe-bg-text{
  font-size:10px;font-weight:600;line-height:16px;
  color:#fff;text-align:center;
  direction:rtl;
}

/* DRAGGABLE CARD */
.cat-card{
  position:absolute;inset:0;
  z-index:2; /* always above swipe backgrounds */
  background:var(--card-bg);
  border-radius:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:flex-start;
  padding:8px 16px 12px 8px;
  gap:16px;
  touch-action:pan-y;
  will-change:transform;
  cursor:grab;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.cat-card.snapping{
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.cat-card.flying{
  transition:transform .28s ease-in;
}
.cat-card:active{cursor:grabbing}

/* CARD CONTENT */
.cat-info{display:flex;flex-direction:column;align-items:flex-start;flex:1;min-width:0}
.cat-name{font-size:14px;font-weight:700;color:var(--text-dark);line-height:24px;white-space:nowrap}
.cat-desc{font-size:10px;font-weight:400;color:var(--text-dark);line-height:16px;white-space:nowrap}
.cat-bottom{display:flex;align-items:center;direction:rtl;padding-top:10px}
.cat-pill{
  display:inline-flex;align-items:center;gap:3px;
  background:#fff;border:0.5px solid rgba(0,0,0,.08);
  border-radius:999px;padding:4px 8px;
  font-size:10px;color:var(--text-muted);
  box-shadow:0 1px 1px rgba(0,0,0,.1);
  white-space:nowrap;z-index:4;
  margin-left:-4px;
}
.cat-dot{
  display:inline-grid;place-items:start;
  width:6px;height:6px;position:relative;flex-shrink:0;
}
.cat-dot-outer{position:absolute;inset:0;background:var(--green-lt);border-radius:50%}
.cat-dot-inner{position:absolute;inset:1.5px;background:var(--green);border-radius:50%}
.cat-avs{display:flex;flex-direction:row-reverse}
.cat-av{
  width:24px;height:24px;border-radius:50%;
  border:0.5px solid #fff;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.14);
  background:#d9d9d9;flex-shrink:0;
  margin-left:-4px;z-index:var(--az,1);
}
.cat-av img{width:100%;height:100%;object-fit:cover}
.cat-icon{width:24px;height:24px;object-fit:contain;flex-shrink:0}

/* ── DOCTOR CAROUSEL ──────────────────────────────────────── */
.dr-section{background:#fff;padding-bottom:8px}
.dr-title{
  display:flex;align-items:center;justify-content:flex-end;
  padding:16px 16px 0;gap:6px;
}
.dr-title-text{
  font-size:12px;font-weight:600;
  color:var(--text-mid);flex:1;text-align:right;
}
.dr-title-icon{width:15px;height:24px;object-fit:contain;flex-shrink:0}
.dr-carousel{
  display:flex;flex-direction:row;
  gap:16px;overflow-x:auto;
  padding:16px 16px 8px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.dr-carousel::-webkit-scrollbar{display:none}
.dr-card{
  flex-shrink:0;width:178px;
  background:var(--card-bg);
  border-radius:16px;padding:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
  scroll-snap-align:start;
}
.dr-photo-wrap{position:relative;flex-shrink:0}
.dr-photo{
  width:56px;height:56px;border-radius:50%;
  overflow:hidden;border:1px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  background:#d9d9d9;
}
.dr-photo img{width:100%;height:100%;object-fit:cover}
.dr-badge{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  background:#e7f6f0;border:1px solid var(--green);
  border-radius:100px;padding:2px 6px;
  font-size:10px;font-weight:600;color:#058c53;
  white-space:nowrap;
}
.dr-info{display:flex;flex-direction:column;align-items:center;width:100%}
.dr-name{font-size:12px;font-weight:700;color:var(--text-mid);text-align:center;line-height:20px}
.dr-spec{font-size:11px;font-weight:400;color:var(--text-mid);text-align:center;line-height:18px}
.dr-meta{
  display:flex;align-items:center;gap:6px;
  justify-content:center;padding-top:16px;width:100%;
  font-size:10px;color:var(--text-muted);
}
.dr-meta span{white-space:nowrap}
.dr-meta strong{color:var(--text-mid);font-weight:700}
.dr-sep{width:2px;height:2px;background:#efefef;border-radius:50%;flex-shrink:0}

/* ── BOTTOM NAV ───────────────────────────────────────────── */
.bottom-nav{
  flex-shrink:0;
  height:82px;
  background:#fff;
  border-top:1px solid rgba(0,0,0,.05);
  display:flex;align-items:flex-start;
  justify-content:space-around;
  padding-top:10px;
}
.bnav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0 8px;flex:1;
  opacity:.45;
  transition:opacity .2s;
}
.bnav-item.active{opacity:1}
.bnav-item svg{width:22px;height:22px}
.bnav-item img{width:22px;height:22px;object-fit:contain}
.bnav-item.active svg{color:var(--teal-dk)}
.bnav-label{font-size:12px;font-weight:500;color:var(--text-muted)}
.bnav-item.active .bnav-label{color:var(--teal-dk)}
.home-pill{
  width:72px;height:4px;background:#111;
  border-radius:4px;margin:8px auto 0;
}

/* tap feedback */
.orbit:not(.is-center) .glass:active{
  filter:brightness(.93);
}
.orbit.is-center .glass:active{
  filter:brightness(.97);
}

/* ── BOTTOM-SHEET MODAL (reservation / e-visit) ──────────── */
.sheet-scrim{position:absolute;inset:0;z-index:50;background:rgba(10,10,10,.45);opacity:0;pointer-events:none;transition:opacity .28s ease}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:88%;transform:translateY(101%);transition:transform .34s cubic-bezier(.22,1,.36,1)}
.sheet.open{transform:translateY(0)}
.sheet-handle{display:flex;justify-content:center;padding-top:12px;flex-shrink:0}
.sheet-handle span{width:40px;height:4px;background:#e0e0e0;border-radius:8px}
.sheet-header{flex-shrink:0;height:64px;display:flex;flex-direction:row;align-items:center;gap:8px;padding:0 16px}
.sheet-title{flex:1;min-width:0;font-size:16px;font-weight:700;color:#0a0a0a;text-align:right;line-height:28px}
.sheet-back,.sheet-close{flex-shrink:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#0a0a0a;cursor:pointer}
.sheet-back{display:none}
.sheet[data-step="2"] .sheet-back{display:flex}
.sheet-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-footer{flex-shrink:0;border-top:1px solid #efefef;padding:8px 16px;background:#fff}
.sheet-cta{width:100%;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.sheet[data-flow="reservation"] .sheet-cta{background:#008299}
.sheet[data-flow="evisit"] .sheet-cta{background:#05985a}
.sheet-home{width:72px;height:4px;background:#09090a;border-radius:8px;margin:8px auto 2px}
.day-row{display:flex;flex-direction:row;gap:8px;padding:0 16px 4px;overflow-x:auto;scrollbar-width:none;direction:rtl}
.day-row::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;width:90px;background:#fff;border:1px solid #f7f7f7;border-radius:8px;padding:12px 8px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
.day-chip-name{font-size:14px;font-weight:600;color:#2e3638;text-align:center;width:100%}
.day-chip-date{font-size:12px;font-weight:500;color:#2e3638;text-align:center;width:100%}
.day-chip.sel{background:#e5f3f5;border-color:#008299}
.ts-list{padding:16px 16px 0}
.ts-row{display:flex;flex-direction:row;align-items:center;gap:8px;padding:16px 0;cursor:pointer;border-bottom:1px solid #efefef}
.ts-row:last-child{border-bottom:none}
.ts-radio,.vt-radio{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1px solid #d4d6d7;box-sizing:border-box}
.ts-row.sel .ts-radio,.vt-row.sel .vt-radio{border:5px solid #008299}
.ts-label{flex:1;min-width:0;font-size:12px;font-weight:600;color:#2e3638;text-align:right;line-height:20px}
.vt-list{padding:16px 16px 0}
.vt-row{display:flex;flex-direction:row;align-items:center;gap:8px;padding:16px 0;cursor:pointer;border-bottom:1px solid #efefef}
.vt-row:last-child{border-bottom:none}
.vt-title{flex:1;min-width:0;font-size:12px;font-weight:600;color:#2e3638;text-align:right;line-height:20px}
.vt-price{display:flex;flex-direction:column;align-items:flex-start;flex-shrink:0;direction:rtl}
.vt-price-now{font-size:11px;font-weight:700;color:#2e3638;line-height:18px;white-space:nowrap}
.vt-price-old{font-size:10px;font-weight:400;color:#b3b9ba;line-height:16px;text-decoration:line-through;white-space:nowrap}

</style>
</head>
<body>

<div id="shell">
<div id="phone">

  <!-- APP BAR — RTL: first child (logo) on the right -->
  <nav class="app-bar">
    <div class="app-bar-back" style="cursor:pointer" onclick="history.back()">
      <img src="assets/57286f8f-1688-4b1a-8274-675ae2c066d8.svg" alt=""
           onerror="this.outerHTML='<svg width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><polyline points=\'9 6 15 12 9 18\'/></svg>'">
    </div>
    <h1 class="app-bar-title">پروفایل و مشاور</h1>
    <div class="app-bar-spacer"></div>
  </nav>

  <!-- SCROLL -->
  <div id="scroll">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-bg">
        <img src="assets/17ffe957-4866-47f6-af13-b7a76544cc0e.png" alt="">
        <div class="hero-overlay"></div>
      </div>

/* inset glow size relative to bubble size */
function glowSz(sz){ return `${Math.round(sz * 0.12)}px` }

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
/* assignment[slotIdx] = specIdx */
let assignment = SPECS.map((_,i) => i);
/* which slot index to promote next on auto-tick */
let nextSlot = 1;
/* DOM refs: orbitEls[specIdx] = .orbit element */
const orbitEls = [];

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
function buildBubble(specIdx, slotIdx) {
  const sp  = SPECS[specIdx];
  const sl  = SLOTS[slotIdx];
  const fp  = FLOAT_PARAMS[slotIdx];
  const sz  = sl[2];

  /* .orbit */
  const orbit = document.createElement('div');
  orbit.className = 'orbit' + (slotIdx === 0 ? ' is-center' : '');
  orbit.style.left = `calc(50% + ${sl[0]}px)`;
  orbit.style.top  = `calc(50% + ${sl[1]}px)`;
  orbit.style.zIndex = sl[3];
  orbit.dataset.specIdx = specIdx;

  /* .sizer */
  const sizer = document.createElement('div');
  sizer.className = 'sizer';
  sizer.style.width  = sz + 'px';
  sizer.style.height = sz + 'px';

  /* .floater */
  const floater = document.createElement('div');
  floater.className = 'floater';
  floater.style.animation = `${fp[0]} ${fp[1]}s ease-in-out infinite ${fp[2]}s`;

  /* .glass */
  const glass = document.createElement('div');
  glass.className = 'glass';
  glass.style.setProperty('--overlay', sp.color);
  glass.style.setProperty('--glow', sp.glow);
  glass.style.setProperty('--glow-sz', glowSz(sz));
  glass.innerHTML = `
    <div class="glass-bg"></div>
    <div class="glass-color"></div>
    <div class="glass-shine"></div>
    <img class="spec-icon" src="${sp.img}" alt="${sp.name}" loading="lazy">
    <span class="spec-count">${sp.count} پزشک آنلاین</span>
    <span class="spec-name">${sp.name}</span>`;

  floater.appendChild(glass);
  sizer.appendChild(floater);
  orbit.appendChild(sizer);

  orbit.addEventListener('click', () => onBubbleTap(specIdx));

  return { orbit, sizer, glass, floater };
}

function initField() {
  const field = document.getElementById('float-field');
  field.innerHTML = '';
  assignment.forEach((specIdx, slotIdx) => {
    const { orbit, sizer, glass, floater } = buildBubble(specIdx, slotIdx);
    orbitEls[specIdx] = { orbit, sizer, glass, floater };
    field.appendChild(orbit);
  });
}

/* ═══════════════════════════════════════════════════════════
   SWAP LOGIC
═══════════════════════════════════════════════════════════ */
function getSlotOf(specIdx) {
  return assignment.indexOf(specIdx);
}

function swap(slotA, slotB) {
  if (slotA === slotB) return;

  const specA = assignment[slotA]; // moves to slotB
  const specB = assignment[slotB]; // moves to slotA

  /* update data */
  assignment[slotA] = specB;
  assignment[slotB] = specA;

  const slA = SLOTS[slotA], slB = SLOTS[slotB];
  const elA = orbitEls[specA], elB = orbitEls[specB];

  /* pause float on both swapping bubbles */
  if (elA.floater) elA.floater.style.animationPlayState = 'paused';
  if (elB.floater) elB.floater.style.animationPlayState = 'paused';

  /* clear any existing transition to get correct from-positions */
  [elA.orbit, elA.sizer, elB.orbit, elB.sizer].forEach(e => e.classList.remove('move'));

  /* force style recalc so browser commits current positions */
  void elA.orbit.offsetWidth;

  /* enable spring transitions */
  [elA.orbit, elA.sizer, elB.orbit, elB.sizer].forEach(e => e.classList.add('move'));

  /* apply new positions — CSS transitions animate from old to new */
  elA.orbit.style.left   = `calc(50% + ${slB[0]}px)`;
  elA.orbit.style.top    = `calc(50% + ${slB[1]}px)`;
  elA.orbit.style.zIndex = slB[3];
  elA.sizer.style.width  = slB[2] + 'px';
  elA.sizer.style.height = slB[2] + 'px';
  elA.glass.style.setProperty('--glow-sz', glowSz(slB[2]));

  elB.orbit.style.left   = `calc(50% + ${slA[0]}px)`;
  elB.orbit.style.top    = `calc(50% + ${slA[1]}px)`;
  elB.orbit.style.zIndex = slA[3];
  elB.sizer.style.width  = slA[2] + 'px';
  elB.sizer.style.height = slA[2] + 'px';
  elB.glass.style.setProperty('--glow-sz', glowSz(slA[2]));

  /* is-center class */
  if (slotA === 0) {
    elA.orbit.classList.remove('is-center');
    elB.orbit.classList.add('is-center');
  } else if (slotB === 0) {
    elB.orbit.classList.remove('is-center');
    elA.orbit.classList.add('is-center');
  }

  /* clean up after spring animation completes */
  setTimeout(() => {
    [elA.orbit, elA.sizer, elB.orbit, elB.sizer].forEach(e => e.classList.remove('move'));
    if (elA.floater) elA.floater.style.animationPlayState = '';
    if (elB.floater) elB.floater.style.animationPlayState = '';
  }, 720);
}

/* ── tap handler ─────────────────────────────────── */
function onBubbleTap(specIdx) {
  const slotIdx = getSlotOf(specIdx);
  if (slotIdx === 0) {
    const catWrap = document.querySelector(`.cat-item-wrap[data-spec-idx="${specIdx}"]`);
    if (catWrap) {
      const scrollEl = document.getElementById('scroll');
      const scrollRect = scrollEl.getBoundingClientRect();
      const itemRect = catWrap.getBoundingClientRect();
      const target = scrollEl.scrollTop + itemRect.top - scrollRect.top - 16;
      scrollEl.scrollTo({ top: target, behavior: 'smooth' });
    }
    return;
  }
  swap(0, slotIdx);
  resetTimer();
}

/* ═══════════════════════════════════════════════════════════
   AUTO-ROTATION
═══════════════════════════════════════════════════════════ */
let timer = null;

function tick() {
  const targetSlot = nextSlot;
  nextSlot = (nextSlot % 15) + 1;
  swap(0, targetSlot);
}

function startTimer() { timer = setInterval(tick, 3000); }
function resetTimer()  { clearInterval(timer); startTimer(); }

            <div class="cat-av" style="--az:1"><img src="${AV3}" alt="" loading="lazy"></div>
          </div>
        </div>
      </div>
    </div>`;

  attachSwipe(wrap.querySelector('.cat-card'));
  return wrap;
}

/* ── pointer-based swipe ────────────────────────── */
function attachSwipe(card) {
  const wrap    = card.parentElement;
  const bgLeft  = wrap.querySelector('.swipe-bg-left');
  const bgRight = wrap.querySelector('.swipe-bg-right');
  let startX = 0, dragging = false, snapped = 0;

  function flyOff(dir) {
    /* full swipe → straight to payment: left→green→phone, right→teal→chat */
    location.href = dir < 0 ? 'payment-v2.html?type=phone' : 'payment-v2.html?type=chat';
    card.classList.remove('snapping');
    card.classList.add('flying');
    card.style.transform = `translateX(${dir * (window.innerWidth + 60)}px)`;
    bgLeft.style.zIndex  = 0;
    bgRight.style.zIndex = 0;
    setTimeout(() => {
      card.classList.remove('flying');
      card.style.transition = 'none';
      card.style.transform  = 'translateX(0)';
      snapped = 0;
      requestAnimationFrame(() => { card.style.transition = ''; });
    }, 300);
  }

  card.addEventListener('pointerdown', e => {
    startX = e.clientX;
    dragging = true;
    card.setPointerCapture(e.pointerId);
    card.classList.remove('snapping', 'flying');
  });

  card.addEventListener('pointermove', e => {
    if (!dragging) return;
    const rawDx = e.clientX - startX;
    const dx    = rawDx + snapped;
    const sameAsSnap = snapped !== 0 && ((snapped < 0 && rawDx < 0) || (snapped > 0 && rawDx > 0));
    const limit = sameAsSnap ? window.innerWidth : SNAP_DIST + 10;
    const clamped = Math.max(-limit, Math.min(limit, dx));
    card.style.transform = `translateX(${clamped}px)`;
    bgLeft.style.zIndex  = clamped < 0 ? 1 : 0;
    bgRight.style.zIndex = clamped > 0 ? 1 : 0;
  });

  card.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - startX;

    /* normal tap on a resting card → open the doctor list */
    if (snapped === 0 && Math.abs(dx) < 8) { location.href = 'dr-list-v2.html'; return; }

    card.classList.add('snapping');

    if (snapped !== 0) {
      const sameDir = (snapped < 0 && dx < 0) || (snapped > 0 && dx > 0);
      if (sameDir && Math.abs(dx) >= FULL_THRESH) {
        flyOff(snapped < 0 ? -1 : 1);
        return;
      }
      if (!sameDir || Math.abs(dx) < 8) snapped = 0;
    } else {
      if      (dx < -SNAP_THRESH) snapped = -SNAP_DIST;
      else if (dx >  SNAP_THRESH) snapped =  SNAP_DIST;
      else                        snapped = 0;
    }
    card.style.transform = `translateX(${snapped}px)`;
  });

  /* state 1 — tap the revealed under-layer to trigger its action */
  function snapBack(){ snapped = 0; card.classList.add('snapping'); card.style.transform = 'translateX(0)'; bgLeft.style.zIndex = 0; bgRight.style.zIndex = 0; }
  /* tap a revealed action → go to payment with its matching header label */
  bgLeft.addEventListener('click',  () => { location.href = 'payment-v2.html?type=phone'; });
  bgRight.addEventListener('click', () => { location.href = 'payment-v2.html?type=chat';  });
}

/* ═══════════════════════════════════════════════════════════
   BUILD CATEGORY LISTS
═══════════════════════════════════════════════════════════ */
function buildCatLists() {
  const listA = document.getElementById('cat-list-a');
  const listB = document.getElementById('cat-list-b');
  CATS.slice(0, 6).forEach((c, i) => {
    const w = buildCatItem(c);
    w.dataset.specIdx = i;
    listA.appendChild(w);
  });
  CATS.slice(6).forEach((c, i) => {
    const w = buildCatItem(c);
    w.dataset.specIdx = i + 6;
    listB.appendChild(w);
  });
}

/* ═══════════════════════════════════════════════════════════
   DOCTOR CAROUSEL
═══════════════════════════════════════════════════════════ */
const DOCS = [
  { name:'دکتر کمال کامیابی نیا', spec:'پزشک عمومی',    rating:'۴٫۵', reviews:'۳۴۲۷', exp:'۱۶' },
  { name:'دکتر سارا رضایی',       spec:'نورولوژی',      rating:'۴٫۸', reviews:'۱۲۸۱', exp:'۱۲' },
  { name:'دکتر علی محمدی',        spec:'قلب و عروق',    rating:'۴٫۹', reviews:'۵۶۱۱', exp:'۲۰' },
  { name:'دکتر مریم احمدی',       spec:'کودکان',        rating:'۴٫۷', reviews:'۸۹۴',  exp:'۹'  },
];

function buildDrSection() {
  const sec = document.getElementById('dr-section');
  const cards = DOCS.map(d => `
    <div class="dr-card">
      <div class="dr-photo-wrap">
        <div class="dr-photo"><img src="${DR_PHOTO}" alt="${d.name}" loading="lazy"></div>
        <span class="dr-badge">فعال</span>
      </div>
      <div class="dr-info">
        <p class="dr-name">${d.name}</p>
        <p class="dr-spec">${d.spec}</p>
        <div class="dr-meta">
          <span>⭐ <strong>${d.rating}</strong> (${d.reviews}+)</span>
          <div class="dr-sep"></div>
          <span>💼 <strong>${d.exp}</strong> سال تجربه</span>
        </div>
      </div>
    </div>`).join('');

  sec.innerHTML = `
    <div class="dr-title">
      <p class="dr-title-text">برترین پزشکان قلب و عروق ایران</p>
      <img class="dr-title-icon" src="${DR_ICON}" alt="">
    </div>
    <div class="dr-carousel">${cards}</div>`;
}

   INIT

initField();
buildCatLists();
buildDrSection();
startTimer();
