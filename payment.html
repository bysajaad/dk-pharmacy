<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>پرداخت – دیجی‌کالا سلامت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
img{display:block;max-width:100%}
button{border:none;background:none;cursor:pointer;font:inherit}

:root{
  --teal:#0098b0;--teal-600:#008299;--teal-50:#e5f3f5;
  --green:#24a565;--green-cta:#05985a;
  --heading:#0c0c0c;--primary:#2e3638;--secondary:#798486;--tertiary:#b3b9ba;
  --subtle:#efefef;--card:#f7f7f7;--icon:#424750;--neutral-medium:#d4d6d7;--border-med:#e0e0e0;
  --accent:#008299; /* CTA color, overridden per flow */
  --font:'Vazirmatn',system-ui,sans-serif;
}
body[data-flow="evisit"]{--accent:#05985a}

html,body{width:100%;height:100%;font-family:var(--font);background:#ededf0;overflow:hidden}

#shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{
  position:relative;width:360px;height:100%;max-height:780px;
  background:#fff;border-radius:32px;overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;
}

/* APP BAR */
.app-bar{flex-shrink:0;height:56px;background:#fff;display:flex;align-items:center;padding:0 20px;gap:20px;z-index:5}
.app-bar-back{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.app-bar-title{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--heading);text-align:right;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-bar-spacer{flex-shrink:0;width:24px}

#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#fff;padding-bottom:8px}
#scroll::-webkit-scrollbar{display:none}

/* SUMMARY CARD */
.pay-summary{margin:10px 16px 0;background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.sum-row{display:flex;flex-direction:row;align-items:flex-start;gap:8px}
.sum-icon{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.sum-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sum-text{font-size:12px;font-weight:400;color:var(--primary);line-height:20px;text-align:right;width:100%}
.sum-text-strong{font-weight:600}
.sum-link{font-size:11px;font-weight:700;color:var(--teal);line-height:18px;cursor:pointer}
.sum-note{font-size:11px;font-weight:400;color:var(--secondary);line-height:18px;text-align:right;width:100%}

/* PAYMENT METHODS */
.pay-methods{margin:8px 16px 0;display:flex;flex-direction:column}
.pay-row{display:flex;flex-direction:row;align-items:flex-start;gap:12px;padding:12px 0;cursor:pointer} /* RTL: radio on the right, data right-aligned beside it */
.pay-radio{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1px solid var(--neutral-medium);margin-top:3px;position:relative}
.pay-row.sel .pay-radio{border:5px solid var(--teal-600)}
.pay-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px} /* flex-start = right edge in RTL */
.pay-head{display:flex;flex-direction:row;align-items:center;gap:8px}
.pay-icon{flex-shrink:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.pay-title{font-size:14px;font-weight:600;color:var(--primary);line-height:24px;white-space:nowrap}
.pay-sub{font-size:11px;font-weight:500;color:var(--secondary);line-height:18px;text-align:right}
.pay-divider{height:1px;background:var(--subtle);margin:0 0}

/* DISCOUNT */
.pay-discount{margin:16px 16px 0;background:#fff;border:1px solid var(--border-med);border-radius:10px;padding:10px 16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between}
.disc-right{display:flex;flex-direction:row;align-items:center;gap:8px}
.disc-icon{width:24px;height:24px;color:var(--icon);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.disc-label{font-size:13px;font-weight:400;color:#323938;line-height:22px}
.disc-add{display:flex;flex-direction:row;align-items:center;gap:2px;color:#16bad7}
.disc-add span{font-size:13px;font-weight:700}

/* STICKY FOOTER */
.pay-footer{flex-shrink:0;background:#fff;border-top:1px solid var(--subtle);padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.pay-total-row{display:flex;flex-direction:row;align-items:center;justify-content:space-between}
.pay-total-label{font-size:12px;font-weight:400;color:var(--secondary);line-height:28px}
.pay-amount{display:flex;flex-direction:row;align-items:baseline;gap:4px;direction:ltr}
.pay-amount-old{font-size:11px;font-weight:400;color:var(--tertiary);text-decoration:line-through;align-self:flex-end}
.pay-amount-now{font-size:18px;font-weight:700;color:var(--heading)}
.pay-amount-unit{font-size:12px;font-weight:400;color:var(--primary)}
.pay-cta{
  width:100%;background:var(--accent);border-radius:12px;
  height:48px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;cursor:pointer;
  transition:background .15s ease;
}
.home-pill{width:72px;height:4px;background:#09090a;border-radius:8px;margin:6px auto 2px}
</style>
</head>
<body data-flow="reservation">

<div id="shell">
<div id="phone">

  <div class="app-bar">
    <button class="app-bar-back" aria-label="بازگشت" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
    <h1 class="app-bar-title" id="payTitle">پرداخت رزرو وقت حضوری</h1>
    <div class="app-bar-spacer"></div>
  </div>

  <div id="scroll">
    <!-- SUMMARY (filled per flow) -->
    <div class="pay-summary" id="paySummary"></div>

    <!-- PAYMENT METHODS -->
    <div class="pay-methods" id="payMethods">
      <div class="pay-row sel" data-cta="پرداخت اعتباری">
        <span class="pay-radio"></span>
        <div class="pay-body">
          <div class="pay-head">
            <span class="pay-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><circle cx="17.5" cy="15.5" r="2.5"/></svg>
            </span>
            <span class="pay-title">پرداخت اعتباری دیجی‌پی</span>
          </div>
          <span class="pay-sub">الان بخر، بعداً پرداخت کن</span>
          <span class="pay-sub">موجودی: ۲٬۰۰۰٬۰۰۰ تومان</span>
        </div>
      </div>
      <div class="pay-divider"></div>
      <div class="pay-row" data-cta="پرداخت با کارت بانکی">
        <span class="pay-radio"></span>
        <div class="pay-body">
          <div class="pay-head">
            <span class="pay-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="5" y1="15" x2="9" y2="15"/></svg>
            </span>
            <span class="pay-title">پرداخت اینترنتی</span>
          </div>
          <span class="pay-sub">پرداخت آنلاین با تمامی کارت‌های بانکی</span>
        </div>
      </div>
      <div class="pay-divider"></div>
      <div class="pay-row" data-cta="پرداخت با کیف پول دیجی‌پی">
        <span class="pay-radio"></span>
        <div class="pay-body">
          <div class="pay-head">
            <span class="pay-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><circle cx="16.5" cy="13" r="1.3"/></svg>
            </span>
            <span class="pay-title">کیف پول دیجی‌پی</span>
          </div>
          <span class="pay-sub">موجودی: ۵۰۰٬۰۰۰ تومان</span>
        </div>
      </div>
    </div>

    <!-- DISCOUNT -->
    <div class="pay-discount">
      <div class="disc-right">
        <span class="disc-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 6v12" stroke-dasharray="2 2"/><path d="M9.5 9.5a1.5 1.5 0 1 1 2.5 1.1M14.5 14.5a1.5 1.5 0 1 1-2.5-1.1"/></svg>
        </span>
        <span class="disc-label">کد تخفیف دارید؟</span>
      </div>
      <button class="disc-add">
        <span>افزودن</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
    </div>
  </div><!-- /scroll -->

  <!-- STICKY FOOTER -->
  <div class="pay-footer">
    <div class="pay-total-row">
      <span class="pay-total-label">مبلغ قابل پرداخت</span>
      <div class="pay-amount">
        <span class="pay-amount-old">۲۸٬۵۶۶٬۰۰۰</span>
        <span class="pay-amount-now">۲۸٬۴۶۴٬۰۰۰</span>
        <span class="pay-amount-unit">تومان</span>
      </div>
    </div>
    <button class="pay-cta" id="payCta">پرداخت اعتباری</button>
    <div class="home-pill"></div>
  </div>

</div><!-- /phone -->
</div><!-- /shell -->

<script>
/* ── FLOW THEME ───────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
const flow = params.get('type') === 'evisit' ? 'evisit' : 'reservation';
document.body.dataset.flow = flow;

const TITLES = {
  reservation: 'پرداخت رزرو وقت حضوری',
  evisit:      'پرداخت ویزیت آنلاین',
};
document.getElementById('payTitle').textContent = TITLES[flow];

/* ── SUMMARY CARD ─────────────────────────────────────────── */
const ICON_PERSON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
const ICON_CAL    = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const ICON_LOC    = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const ICON_INFO   = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

function row(icon, bodyHtml){
  return `<div class="sum-row"><span class="sum-icon">${icon}</span><div class="sum-body">${bodyHtml}</div></div>`;
}

const SUMMARY = {
  reservation:
    row(ICON_PERSON, `<p class="sum-text sum-text-strong">دکتر کمال کامیابی نیا</p>`) +
    row(ICON_CAL,    `<p class="sum-text">یکشنبه ۲۶ مرداد ۱۴۰۵</p>`) +
    row(ICON_LOC,    `<p class="sum-text">ونک، جنب پیتزا شیلا، ساختمان اکبرآبادی، ط۴ واحد ۲۳۶</p><span class="sum-link">مسیریابی</span>`) +
    row(ICON_LOC,    `<p class="sum-text">شماره مطب: ۰۲۱-۴۶۴۴۳۳۳۷</p>`),
  evisit:
    row(ICON_PERSON, `<p class="sum-text sum-text-strong">دکتر کمال کامیابی نیا</p>`) +
    row(ICON_INFO,   `<p class="sum-text">پس از پرداخت، به صورت خودکار از شماره ۰۲۱-۲۴۰۰۰ یک تماس با شما برقرار خواهد شد.</p><span class="sum-note">مدت زمان انتظار شما تا اتصال به پزشک، جزو زمان مکالمه محاسبه نمی‌گردد.</span>`),
};
document.getElementById('paySummary').innerHTML = SUMMARY[flow];

/* ── PAYMENT METHOD SELECTION → dynamic CTA text ──────────── */
const cta = document.getElementById('payCta');
document.querySelectorAll('#payMethods .pay-row').forEach(rowEl => {
  rowEl.addEventListener('click', () => {
    document.querySelectorAll('#payMethods .pay-row').forEach(r => r.classList.remove('sel'));
    rowEl.classList.add('sel');
    cta.textContent = rowEl.dataset.cta;
  });
});
</script>
</body>
</html>
